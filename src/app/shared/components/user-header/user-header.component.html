<mat-toolbar class="user-header">
  <div class="header-content">
    <!-- Logo Section -->
    <div class="logo-section">
      <mat-icon class="logo-icon">music_note</mat-icon>
      <span class="app-name">Surify</span>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search songs, artists, albums...</mat-label>
        <input
          matInput
          [(ngModel)]="searchQuery"
          (input)="onSearchInput($event)"
          (keyup.enter)="onSearch()"
          placeholder="Search..." />
        <mat-icon matSuffix (click)="onSearch()">search</mat-icon>
      </mat-form-field>
    </div>

    <!-- User Actions -->
    <div class="user-actions">
      <!-- Notifications -->
      <button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="action-btn">
        <mat-icon matBadge="2" matBadgeColor="warn">notifications</mat-icon>
      </button>

      <mat-menu #notificationMenu="matMenu" class="notification-menu">
        <div class="menu-header">
          <h3>Notifications</h3>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon>music_note</mat-icon>
          <span>New album from your favorite artist</span>
        </button>
        <button mat-menu-item>
          <mat-icon>group</mat-icon>
          <span>Collaborative session invitation</span>
        </button>
        <button mat-menu-item>
          <mat-icon>favorite</mat-icon>
          <span>New playlist shared with you</span>
        </button>
      </mat-menu>

      <!-- User Menu -->
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="action-btn">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu">
        <div class="user-info">
          <div class="user-avatar">
            <mat-icon *ngIf="!getUserAvatar() || avatarError">account_circle</mat-icon>
            <img
              *ngIf="getUserAvatar() && !avatarError"
              [src]="getUserAvatar()"
              alt="Profile"
              class="avatar-image"
              (error)="onImageError($event)" />
          </div>
          <div class="user-details">
            <div class="user-name">{{ getUserDisplayName() }}</div>
            <div class="user-email">{{ getUserEmail() }}</div>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onProfile()">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item (click)="onSettings()">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
